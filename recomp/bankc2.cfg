# Flashback (USA) — bank $C2: room painter.
#
# $C21AD3 walks the room's painting stream and expands masked 4bpp blocks
# into $7E:2000. It is the hot spot of every room load; src/paint_native.c
# replaces it. The rest of bank $C2 stays interpreted.
bank = c2

func RoomPaint 1AD3 entry_mx:0,0 exit_mx:0,0
hle_func 1AD3 HlePaintRoom
